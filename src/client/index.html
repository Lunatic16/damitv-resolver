<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="DamiTV HLS resolver — live sports, wasm unlock, instant play.">
  <title>DamiTV Resolver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg>
        </span>
        <span class="topbar__logo">DamiTV</span>
      </div>

      <label class="search">
        <svg class="search__icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="event-search" type="text" placeholder="Search matches and channels" aria-label="Search matches and channels" autocomplete="off" spellcheck="false">
        <span class="search__key" aria-hidden="true">/</span>
      </label>

      <div class="topbar__aside">
        <div class="status" role="status" aria-live="polite">
          <span class="status__dot" aria-hidden="true"></span>
          <span id="live-meta" class="status__text">—</span>
        </div>
        <button
          type="button"
          id="playlist-download"
          class="btn"
          title="Download a dynamic M3U8 playlist of the currently listed matches and channels"
        >M3U8 playlist</button>
        <button
          type="button"
          id="playlist-copy"
          class="btn"
          title="Copy the dynamic playlist URL for IPTV players like VLC, mpv, or TiviMate"
        >Copy URL</button>
        <button type="button" id="refresh-button" class="btn btn--icon" aria-label="Refresh" title="Refresh">
          <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
        </button>
      </div>
    </header>

    <nav id="sport-tabs" class="sports" aria-label="Sport"></nav>
    <p id="error-message" class="banner" role="alert" hidden>
      <span id="banner-text"></span>
      <button type="button" id="banner-retry" class="btn btn--soft" hidden>Retry</button>
    </p>

    <div class="workspace">
      <section class="stage" aria-label="Player">
        <div class="screen">
          <div class="screen__idle">
            <p class="screen__idle-brand">DamiTV</p>
            <p class="screen__idle-copy">Pick a match, choose a server, and it plays right here.</p>
          </div>
          <video id="video-element" class="screen__video" controls playsinline autoplay hidden></video>
          <div class="screen__hud">
            <span class="hud__live"><span aria-hidden="true"></span>LIVE</span>
            <span id="stream-watching" class="hud__chip"></span>
            <span id="stream-server" class="hud__chip hud__chip--server"></span>
          </div>
          <button type="button" id="play-overlay" class="play-overlay" hidden aria-label="Play">
            <span aria-hidden="true"></span>
          </button>
        </div>

        <div class="stage__bar">
          <div class="stage__titles">
            <p id="stream-kicker" class="stage__kicker">Ready</p>
            <h1 id="stream-title" class="stage__title">Choose a Match to Start</h1>
          </div>
          <div class="stage__tools">
            <select id="audio-select" class="audio-select" aria-label="Audio language" hidden></select>
            <ul class="timing">
              <li class="timing__item">
                <span class="timing__k">Resolve</span>
                <span id="timing-resolve" class="timing__v">—</span>
              </li>
              <li class="timing__item">
                <span class="timing__k">First Frame</span>
                <span id="timing-play" class="timing__v">—</span>
              </li>
            </ul>
          </div>
        </div>

        <div class="stage__lower">
        <section id="stream-panel" class="card servers" aria-label="Stream servers">
          <div class="card__head">
            <h2 class="card__title">Servers</h2>
            <span id="stream-count" class="card__count">0</span>
          </div>
          <div id="stream-empty" class="card__empty">Pick a match to load servers.</div>
          <div id="stream-list" class="streams__grid" hidden></div>
        </section>

        <section id="exports" class="card exports" aria-label="Watch elsewhere" hidden>
          <div class="card__head">
            <h2 class="card__title">Watch elsewhere</h2>
          </div>
          <div class="exports__grid">
            <div class="export">
              <span class="export__k">Direct</span>
              <div class="export__row">
                <input id="export-direct-url" readonly>
                <button type="button" class="btn btn--soft" data-copy="export-direct-url">Copy</button>
              </div>
            </div>
            <div class="export">
              <span class="export__k">Proxied</span>
              <div class="export__row">
                <input id="export-proxied-url" readonly>
                <button type="button" class="btn btn--soft" data-copy="export-proxied-url">Copy</button>
              </div>
            </div>
            <div class="export">
              <span class="export__k">VLC</span>
              <div class="export__row">
                <input id="export-vlc-url" readonly>
                <button type="button" class="btn btn--soft" data-copy="export-vlc-url">Copy</button>
              </div>
            </div>
            <div class="export">
              <span class="export__k">mpv</span>
              <div class="export__row">
                <input id="export-mpv-url" readonly>
                <button type="button" class="btn btn--soft" data-copy="export-mpv-url">Copy</button>
              </div>
            </div>
          </div>
        </section>
        </div>
      </section>

      <aside class="card rail" aria-label="Live matches and channels">
        <div class="card__head">
          <h2 class="card__title card__title--lg">Matches</h2>
          <span id="match-count" class="card__count">0</span>
          <div class="scope" role="group" aria-label="Scope">
            <button type="button" class="scope__btn is-active" data-scope="live">Live</button>
            <button type="button" class="scope__btn" data-scope="all">All</button>
          </div>
        </div>
        <ul id="match-list" class="matches"></ul>
      </aside>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
